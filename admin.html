<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Management</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f0f2f5;
      padding: 20px;
      color: #333;
    }

    /* 登录页 */
    .login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-card {
      background: #fff;
      border-radius: 12px;
      padding: 40px 32px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      text-align: center;
      width: 100%;
      max-width: 360px;
    }

    .login-card .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }

    .login-card h2 {
      font-size: 20px;
      margin-bottom: 20px;
      color: #333;
    }

    .login-card input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    .login-card input:focus {
      border-color: #4a90d9;
    }

    .login-card button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #4a90d9, #357abd);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .login-card button:active { opacity: 0.85; }

    .login-error {
      color: #e74c3c;
      font-size: 13px;
      margin-top: 8px;
      display: none;
    }

    /* 管理页 */
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header h1 {
      font-size: 22px;
      color: #1a1a1a;
    }

    .header .stats {
      font-size: 14px;
      color: #888;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:active { opacity: 0.8; }

    .btn-primary { background: #4a90d9; color: #fff; }
    .btn-danger { background: #e74c3c; color: #fff; }
    .btn-outline { background: #fff; color: #4a90d9; border: 1.5px solid #4a90d9; }
    .btn-logout { background: #f5f5f5; color: #999; }

    .lead-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .lead-card {
      background: #fff;
      border-radius: 10px;
      padding: 18px 20px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      position: relative;
    }

    .lead-card .lead-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f0f0f0;
    }

    .lead-card .lead-time { font-size: 13px; color: #999; }
    .lead-card .lead-id { font-size: 11px; color: #ccc; font-family: monospace; }

    .lead-card .lead-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .lead-card .field { font-size: 14px; }
    .lead-card .field .label { color: #999; font-size: 12px; margin-bottom: 2px; }
    .lead-card .field .value { color: #333; font-weight: 500; }
    .lead-card .field .value.contact { color: #4a90d9; }
    .lead-card .field.full-width { grid-column: 1 / -1; }

    .lead-card .delete-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border: none;
      background: #f5f5f5;
      border-radius: 50%;
      cursor: pointer;
      font-size: 14px;
      color: #999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .lead-card .delete-btn:hover { background: #fee; color: #e74c3c; }

    .empty { text-align: center; padding: 60px 20px; color: #ccc; }
    .empty .icon { font-size: 48px; margin-bottom: 12px; }
    .loading { text-align: center; padding: 40px; color: #999; }

    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 999;
      display: none;
    }

    @media (max-width: 600px) {
      .lead-card .lead-body { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- 登录页 -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="icon">🔒</div>
      <h2>Admin Login</h2>
      <input type="password" id="passwordInput" placeholder="Enter password" onkeydown="if(event.key==='Enter') doLogin()">
      <button onclick="doLogin()">Login</button>
      <div class="login-error" id="loginError">Incorrect password, please try again</div>
    </div>
  </div>

  <!-- 管理页 -->
  <div class="container" id="adminPanel" style="display:none;">
    <div class="header">
      <div>
        <h1>📊 Lead Management</h1>
        <div class="stats" id="stats">Loading...</div>
      </div>
      <div class="actions">
        <button class="btn btn-primary" onclick="loadLeads()">🔄 Refresh</button>
        <button class="btn btn-outline" onclick="exportCSV()">📥 Export CSV</button>
        <button class="btn btn-logout" onclick="doLogout()">Logout</button>
      </div>
    </div>

    <div class="lead-list" id="leadList">
      <div class="loading">加载中...</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let adminToken = localStorage.getItem('adminToken') || '';

    // 页面加载时检查登录状态
    if (adminToken) {
      showAdmin();
      loadLeads();
    }

    async function doLogin() {
      const password = document.getElementById('passwordInput').value;
      if (!password) return;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await res.json();

        if (data.success) {
          adminToken = data.token;
          localStorage.setItem('adminToken', adminToken);
          showAdmin();
          loadLeads();
        } else {
          document.getElementById('loginError').style.display = 'block';
          document.getElementById('passwordInput').value = '';
        }
      } catch (err) {
        document.getElementById('loginError').style.display = 'block';
      }
    }

    function doLogout() {
      adminToken = '';
      localStorage.removeItem('adminToken');
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('adminPanel').style.display = 'none';
    }

    function showAdmin() {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
    }

    async function loadLeads() {
      const list = document.getElementById('leadList');
      const stats = document.getElementById('stats');

      try {
        const res = await fetch('/api/leads', {
          headers: { 'X-Admin-Token': adminToken }
        });

        if (res.status === 403) {
          doLogout();
          return;
        }

        const leads = await res.json();
        stats.textContent = `${leads.length} leads total`;

        if (leads.length === 0) {
          list.innerHTML = '<div class="empty"><div class="icon">📭</div><p>No leads yet</p></div>';
          return;
        }

        list.innerHTML = leads.map(lead => `
          <div class="lead-card">
            <button class="delete-btn" onclick="deleteLead('${lead.id}')" title="删除">✕</button>
            <div class="lead-header">
              <div>
                <span class="lead-time">📅 ${lead.submittedAtLocal}</span>
              </div>
              <span class="lead-id">${lead.id.slice(0, 8)}</span>
            </div>
            <div class="lead-body">
              <div class="field">
                <div class="label">Contact</div>
                <div class="value contact">${lead.contact}</div>
              </div>
              <div class="field">
                <div class="label">Method</div>
                <div class="value">${lead.contactType === 'whatsapp' ? '💬 WhatsApp' : '✈️ Telegram'}</div>
              </div>
              <div class="field">
                <div class="label">Familiar with peptides</div>
                <div class="value">${lead.peptideKnowledge || '-'}</div>
              </div>
              <div class="field">
                <div class="label">Used peptides before</div>
                <div class="value">${lead.peptideUsage || '-'}</div>
              </div>
              <div class="field full-width">
                <div class="label">Occupation / Industry</div>
                <div class="value">${lead.job || '-'}</div>
              </div>
              ${lead.notes ? `
              <div class="field full-width">
                <div class="label">Notes</div>
                <div class="value">${lead.notes}</div>
              </div>` : ''}
            </div>
          </div>
        `).join('');

      } catch (err) {
        list.innerHTML = '<div class="empty"><div class="icon">⚠️</div><p>Failed to load, please refresh</p></div>';
      }
    }

    async function deleteLead(id) {
      if (!confirm('Are you sure you want to delete this lead?')) return;

      try {
        const res = await fetch(`/api/leads/${id}`, {
          method: 'DELETE',
          headers: { 'X-Admin-Token': adminToken }
        });
        const data = await res.json();
        if (data.success) {
          showToast('Deleted');
          loadLeads();
        }
      } catch (err) {
        showToast('Delete failed');
      }
    }

    function exportCSV() {
      window.open('/api/export', '_blank');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    // 每30秒自动刷新
    setInterval(loadLeads, 30000);
  </script>
</body>
</html>
