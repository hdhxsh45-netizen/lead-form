<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>线索管理后台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f0f2f5;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header h1 {
      font-size: 22px;
      color: #1a1a1a;
    }

    .header .stats {
      font-size: 14px;
      color: #888;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:active { opacity: 0.8; }

    .btn-primary {
      background: #4a90d9;
      color: #fff;
    }

    .btn-danger {
      background: #e74c3c;
      color: #fff;
    }

    .btn-outline {
      background: #fff;
      color: #4a90d9;
      border: 1.5px solid #4a90d9;
    }

    .lead-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .lead-card {
      background: #fff;
      border-radius: 10px;
      padding: 18px 20px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
      position: relative;
    }

    .lead-card .lead-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #f0f0f0;
    }

    .lead-card .lead-time {
      font-size: 13px;
      color: #999;
    }

    .lead-card .lead-id {
      font-size: 11px;
      color: #ccc;
      font-family: monospace;
    }

    .lead-card .lead-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .lead-card .field {
      font-size: 14px;
    }

    .lead-card .field .label {
      color: #999;
      font-size: 12px;
      margin-bottom: 2px;
    }

    .lead-card .field .value {
      color: #333;
      font-weight: 500;
    }

    .lead-card .field .value.contact {
      color: #4a90d9;
    }

    .lead-card .field.full-width {
      grid-column: 1 / -1;
    }

    .lead-card .delete-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border: none;
      background: #f5f5f5;
      border-radius: 50%;
      cursor: pointer;
      font-size: 14px;
      color: #999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .lead-card .delete-btn:hover {
      background: #fee;
      color: #e74c3c;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #ccc;
    }

    .empty .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 999;
      display: none;
    }

    @media (max-width: 600px) {
      .lead-card .lead-body {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>📊 线索管理后台</h1>
        <div class="stats" id="stats">加载中...</div>
      </div>
      <div class="actions">
        <button class="btn btn-primary" onclick="loadLeads()">🔄 刷新</button>
        <button class="btn btn-outline" onclick="exportCSV()">📥 导出 CSV</button>
      </div>
    </div>

    <div class="lead-list" id="leadList">
      <div class="loading">加载中...</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    async function loadLeads() {
      const list = document.getElementById('leadList');
      const stats = document.getElementById('stats');

      try {
        const res = await fetch('/api/leads');
        const leads = await res.json();

        stats.textContent = `共 ${leads.length} 条线索`;

        if (leads.length === 0) {
          list.innerHTML = '<div class="empty"><div class="icon">📭</div><p>暂无线索</p></div>';
          return;
        }

        list.innerHTML = leads.map(lead => `
          <div class="lead-card">
            <button class="delete-btn" onclick="deleteLead('${lead.id}')" title="删除">✕</button>
            <div class="lead-header">
              <div>
                <span class="lead-time">📅 ${lead.submittedAtLocal}</span>
              </div>
              <span class="lead-id">${lead.id.slice(0, 8)}</span>
            </div>
            <div class="lead-body">
              <div class="field">
                <div class="label">联系方式</div>
                <div class="value contact">${lead.contact}</div>
              </div>
              <div class="field">
                <div class="label">方式</div>
                <div class="value">${lead.contactType === 'whatsapp' ? '💬 WhatsApp' : '✈️ Telegram'}</div>
              </div>
              <div class="field">
                <div class="label">是否了解多肽</div>
                <div class="value">${lead.peptideKnowledge || '-'}</div>
              </div>
              <div class="field">
                <div class="label">是否使用过多肽</div>
                <div class="value">${lead.peptideUsage || '-'}</div>
              </div>
              <div class="field full-width">
                <div class="label">职业/行业</div>
                <div class="value">${lead.job || '-'}</div>
              </div>
              ${lead.notes ? `
              <div class="field full-width">
                <div class="label">备注</div>
                <div class="value">${lead.notes}</div>
              </div>` : ''}
            </div>
          </div>
        `).join('');

      } catch (err) {
        list.innerHTML = '<div class="empty"><div class="icon">⚠️</div><p>加载失败，请刷新重试</p></div>';
      }
    }

    async function deleteLead(id) {
      if (!confirm('确定删除这条线索？')) return;

      try {
        const res = await fetch(`/api/leads/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) {
          showToast('已删除');
          loadLeads();
        }
      } catch (err) {
        showToast('删除失败');
      }
    }

    function exportCSV() {
      window.open('/api/export', '_blank');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2000);
    }

    // 初始加载
    loadLeads();

    // 每30秒自动刷新
    setInterval(loadLeads, 30000);
  </script>
</body>
</html>
