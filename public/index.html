<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Customer Registration</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f5f7fa;
      min-height: 100vh;
      padding: 20px 16px 40px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 22px;
      color: #1a1a1a;
      font-weight: 600;
    }

    .header p {
      font-size: 14px;
      color: #888;
      margin-top: 6px;
    }

    .form-card {
      background: #fff;
      border-radius: 12px;
      padding: 24px 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;
      font-size: 15px;
      color: #333;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .form-group label .required {
      color: #e74c3c;
      margin-left: 2px;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      color: #333;
      background: #fafafa;
      transition: border-color 0.2s, background 0.2s;
      -webkit-appearance: none;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #4a90d9;
      background: #fff;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .radio-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .radio-option {
      flex: 1;
      min-width: 100px;
    }

    .radio-option input[type="radio"] {
      display: none;
    }

    .radio-option label {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border: 1.5px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      color: #666;
      background: #fafafa;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 0;
      font-weight: 400;
    }

    .radio-option input[type="radio"]:checked + label {
      border-color: #4a90d9;
      background: #e8f0fe;
      color: #4a90d9;
      font-weight: 500;
    }

    .contact-type-toggle {
      display: flex;
      gap: 0;
      margin-bottom: 12px;
      border-radius: 8px;
      overflow: hidden;
      border: 1.5px solid #e0e0e0;
    }

    .contact-type-toggle input[type="radio"] {
      display: none;
    }

    .contact-type-toggle label {
      flex: 1;
      text-align: center;
      padding: 10px;
      font-size: 14px;
      color: #666;
      background: #fafafa;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 0;
      font-weight: 400;
      border: none;
    }

    .contact-type-toggle input[type="radio"]:checked + label {
      background: #4a90d9;
      color: #fff;
      font-weight: 500;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #4a90d9, #357abd);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }

    .submit-btn:active {
      opacity: 0.85;
    }

    .submit-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .success-msg {
      display: none;
      text-align: center;
      padding: 40px 20px;
    }

    .success-msg .icon {
      font-size: 56px;
      margin-bottom: 16px;
    }

    .success-msg h2 {
      font-size: 20px;
      color: #333;
      margin-bottom: 8px;
    }

    .success-msg p {
      font-size: 14px;
      color: #888;
    }

    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 999;
      display: none;
      max-width: 90%;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📋 Customer Registration</h1>
      <p>Please fill in the information below and we will contact you soon</p>
    </div>

    <div class="form-card" id="formCard">
      <form id="leadForm">
        <!-- Contact -->
        <div class="form-group">
          <label>Contact Method <span class="required">*</span></label>
          <div class="contact-type-toggle">
            <input type="radio" name="contactType" id="whatsapp" value="whatsapp" checked>
            <label for="whatsapp">💬 WhatsApp</label>
            <input type="radio" name="contactType" id="telegram" value="telegram">
            <label for="telegram">✈️ Telegram</label>
          </div>
          <input type="text" id="contact" placeholder="Enter your username / phone number / link" required>
        </div>

        <!-- Peptide Knowledge -->
        <div class="form-group">
          <label>Are you familiar with peptide products? <span class="required">*</span></label>
          <div class="radio-group">
            <div class="radio-option">
              <input type="radio" name="peptideKnowledge" id="know_yes" value="Yes, very familiar">
              <label for="know_yes">Yes</label>
            </div>
            <div class="radio-option">
              <input type="radio" name="peptideKnowledge" id="know_some" value="Somewhat familiar">
              <label for="know_some">Somewhat</label>
            </div>
            <div class="radio-option">
              <input type="radio" name="peptideKnowledge" id="know_no" value="Not familiar">
              <label for="know_no">No</label>
            </div>
          </div>
        </div>

        <!-- Peptide Usage -->
        <div class="form-group">
          <label>Have you used peptide products before? <span class="required">*</span></label>
          <div class="radio-group">
            <div class="radio-option">
              <input type="radio" name="peptideUsage" id="use_yes" value="Regular user">
              <label for="use_yes">Regularly</label>
            </div>
            <div class="radio-option">
              <input type="radio" name="peptideUsage" id="use_some" value="Occasional user">
              <label for="use_some">Occasionally</label>
            </div>
            <div class="radio-option">
              <input type="radio" name="peptideUsage" id="use_no" value="Never used">
              <label for="use_no">Never</label>
            </div>
          </div>
        </div>

        <!-- Occupation -->
        <div class="form-group">
          <label>Your Occupation / Industry <span class="required">*</span></label>
          <input type="text" id="job" placeholder="e.g. Beauty industry, health supplement sales, personal use" required>
        </div>

        <!-- Notes -->
        <div class="form-group">
          <label>Additional Notes</label>
          <textarea id="notes" placeholder="Anything else you'd like to share or any special requirements (optional)"></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Submit & Connect</button>
      </form>
    </div>

    <!-- Success message -->
    <div class="success-msg" id="successMsg">
      <div class="icon">✅</div>
      <h2>Submitted Successfully!</h2>
      <p>Connecting you to our customer service...</p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const form = document.getElementById('leadForm');
    const submitBtn = document.getElementById('submitBtn');
    const formCard = document.getElementById('formCard');
    const successMsg = document.getElementById('successMsg');
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const contactType = document.querySelector('input[name="contactType"]:checked')?.value;
      const contact = document.getElementById('contact').value.trim();
      const peptideKnowledge = document.querySelector('input[name="peptideKnowledge"]:checked')?.value;
      const peptideUsage = document.querySelector('input[name="peptideUsage"]:checked')?.value;
      const job = document.getElementById('job').value.trim();
      const notes = document.getElementById('notes').value.trim();

      if (!contact) {
        showToast('Please enter your contact information');
        return;
      }
      if (!peptideKnowledge) {
        showToast('Please select your familiarity with peptide products');
        return;
      }
      if (!peptideUsage) {
        showToast('Please select your peptide product usage');
        return;
      }
      if (!job) {
        showToast('Please enter your occupation / industry');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';

      try {
        const res = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contact, contactType, peptideKnowledge, peptideUsage, job, notes })
        });
        const data = await res.json();

        if (data.success) {
          // Redirect to customer service based on selected method
          const message = encodeURIComponent('Hello, I just submitted my customer information and would like to inquire about peptide products. My account is: ' + contact);
          
          let redirectUrl = '';
          if (contactType === 'telegram') {
            // Redirect to Telegram
            redirectUrl = 'https://t.me/Ada_sister?text=' + message;
          } else {
            // Redirect to WhatsApp
            const whatsappNumber = '85261967494';
            redirectUrl = 'https://wa.me/' + whatsappNumber + '?text=' + message;
          }
          
          // Delay 500ms before redirecting
          setTimeout(() => {
            window.location.href = redirectUrl;
          }, 500);
        } else {
          showToast(data.error || 'Submission failed, please try again');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit & Connect';
        }
      } catch (err) {
        showToast('Network error, please check your connection and try again');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit & Connect';
      }
    });
  </script>
</body>
</html>
